# Static dashboard for the container flavour of this build. The native
# install (start.bat) serves the same files through Vite, so this file only
# matters if someone puts the dashboard behind nginx again.
#
# No upstream domains or SEO routes: the app is a single hash-routed page.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API owns the media and the MCP endpoint. Everything below is proxied
    # to the backend service on the compose network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /videos/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /thumbnails/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /collector/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /mcp {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # index.html points at the hashed asset bundle: never cache it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
